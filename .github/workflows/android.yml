name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        shell: bash
        run: |
          if ! gradle :app:lintDebug --stacktrace; then
            echo "===== FULL LINT REPORT ====="
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              cat app/build/reports/lint-results-debug.txt
            fi
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build isolated installation-check APK
        run: gradle :app:assembleInstallCheck --stacktrace

      - name: Upload parallel-installation test APK
        uses: actions/upload-artifact@v4
        with:
          name: KeySwiper-INSTALL-CHECK-${{ github.run_number }}
          path: app/build/outputs/apk/installCheck/app-installCheck.apk
          if-no-files-found: error

      - name: Enable KVM for Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Android emulator IME smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: aosp_atd
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-spellchecker: true
          profile: pixel_2
          disable-animations: true
          script: |
            bash scripts/ime-smoke-test.sh app/build/outputs/apk/debug/app-debug.apk
            echo "Verifying parallel installation with a separate package ID (no existing data removed)"
            adb install -r app/build/outputs/apk/installCheck/app-installCheck.apk
            adb shell pm path cloud.kosch.keyswiper.installcheck | grep -q 'package:'

      - name: Upload test and smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeySwiper-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            artifacts/ime-smoke/
          if-no-files-found: ignore


      # Android requires the SAME private signing key across every update. The
      # GitHub-hosted debug.keystore is freshly generated on each runner and
      # must never be used for a downloadable release.
      - name: Load durable production signing key
        id: release_signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSWIPER_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSWIPER_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSWIPER_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSWIPER_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release APK withheld: stable signing secrets not configured. Read docs/INSTALLATION_SIGNING.md."
            echo "### APK publication is blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Add four private signing secrets before generating a user-installable update. Debug APKs are not upgradable between ephemeral runners." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keyswiper-release.jks"
          chmod 600 "$RUNNER_TEMP/keyswiper-release.jks"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build permanently signed release APK
        if: steps.release_signing.outputs.configured == 'true'
        env:
          KEYSWIPER_RELEASE_STORE_PATH: ${{ runner.temp }}/keyswiper-release.jks
          KEYSWIPER_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSWIPER_RELEASE_STORE_PASSWORD }}
          KEYSWIPER_RELEASE_KEY_ALIAS: ${{ secrets.KEYSWIPER_RELEASE_KEY_ALIAS }}
          KEYSWIPER_RELEASE_KEY_PASSWORD: ${{ secrets.KEYSWIPER_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK certificate matches pinned public identity
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          EXPECTED="$(tr -d '[:space:]' < docs/RELEASE_SIGNER_SHA256.txt)"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate differs from protected publisher identity. Refusing public release."
            exit 1
          fi
          echo "Signing certificate verified: $ACTUAL" >> "$GITHUB_STEP_SUMMARY"

      # PRs also compile release with a disposable TEST key; it is never published.
      - name: Create disposable PR-only signing certificate
        if: github.event_name == 'pull_request'
        run: |
          keytool -genkeypair -alias ci-test -keyalg RSA -keysize 2048 -validity 2 \
            -storetype PKCS12 -keystore "$RUNNER_TEMP/pr-only.jks" \
            -storepass ci-test-password -keypass ci-test-password \
            -dname "CN=KeySwiper CI Test" -noprompt

      - name: Check release build compilation (PR only)
        if: github.event_name == 'pull_request'
        env:
          KEYSWIPER_RELEASE_STORE_PATH: ${{ runner.temp }}/pr-only.jks
          KEYSWIPER_RELEASE_STORE_PASSWORD: ci-test-password
          KEYSWIPER_RELEASE_KEY_ALIAS: ci-test
          KEYSWIPER_RELEASE_KEY_PASSWORD: ci-test-password
        run: |
          gradle :app:assembleRelease --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Read build identity
        if: steps.release_signing.outputs.configured == 'true'
        id: build_meta
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          APK_NAME="KeySwiper-v$VERSION_NAME-build$VERSION_CODE-run$GITHUB_RUN_NUMBER.apk"
          TAG="v$VERSION_NAME-b$VERSION_CODE-run$GITHUB_RUN_NUMBER"
          PAGE="docs/versions/$VERSION_NAME-build$VERSION_CODE-run$GITHUB_RUN_NUMBER.md"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp app/build/outputs/apk/release/app-release.apk "KeySwiper-latest.apk"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "page=$PAGE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifact
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KeySwiper-${{ steps.build_meta.outputs.version_name }}-build-${{ steps.build_meta.outputs.version_code }}-run-${{ github.run_number }}
          path: |
            ${{ steps.build_meta.outputs.apk_name }}
            KeySwiper-latest.apk
          if-no-files-found: error

      - name: Create permanent GitHub Release
        if: steps.release_signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build_meta.outputs.tag }}
          APK_NAME: ${{ steps.build_meta.outputs.apk_name }}
          VERSION_NAME: ${{ steps.build_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.build_meta.outputs.version_code }}
          SHA256: ${{ steps.build_meta.outputs.sha256 }}
        shell: bash
        run: |
          CHANGELOG_SECTION=$(awk -v v="$VERSION_NAME" '
            $0 ~ "^## " v " " {p=1}
            p && /^## / && $0 !~ "^## " v " " {exit}
            p {print}
          ' CHANGELOG.md)

          cat > release-notes.md <<EOF
          KeySwiper $VERSION_NAME — build $VERSION_CODE — CI run $GITHUB_RUN_NUMBER

          Commit: $GITHUB_SHA
          SHA-256: $SHA256

          $CHANGELOG_SECTION
          EOF

          gh release create "$TAG" "$APK_NAME" "KeySwiper-latest.apk" --prerelease \
            --title "KeySwiper $VERSION_NAME · build $VERSION_CODE · run $GITHUB_RUN_NUMBER" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

      - name: Generate permanent version page
        if: steps.release_signing.outputs.configured == 'true'
        env:
          PAGE: ${{ steps.build_meta.outputs.page }}
          TAG: ${{ steps.build_meta.outputs.tag }}
          APK_NAME: ${{ steps.build_meta.outputs.apk_name }}
          VERSION_NAME: ${{ steps.build_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.build_meta.outputs.version_code }}
          SHA256: ${{ steps.build_meta.outputs.sha256 }}
          SHORT_SHA: ${{ steps.build_meta.outputs.short_sha }}
        shell: bash
        run: |
          mkdir -p docs/versions

          CHANGELOG_SECTION=$(awk -v v="$VERSION_NAME" '
            $0 ~ "^## " v " " {p=1}
            p && /^## / && $0 !~ "^## " v " " {exit}
            p {print}
          ' CHANGELOG.md)

          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
          LATEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/KeySwiper-latest.apk"
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          {
            echo "# KeySwiper $VERSION_NAME — build $VERSION_CODE — run $GITHUB_RUN_NUMBER"
            echo
            echo "**Permanent APK:** [$APK_NAME]($DOWNLOAD_URL)"
            echo
            echo "**Latest APK alias:** [KeySwiper-latest.apk]($LATEST_URL)"
            echo
            echo "- Version: $VERSION_NAME"
            echo "- Version code: $VERSION_CODE"
            echo "- CI run: [$GITHUB_RUN_NUMBER]($RUN_URL)"
            echo "- Commit: $GITHUB_SHA"
            echo "- Short commit: $SHORT_SHA"
            echo "- SHA-256: $SHA256"
            echo "- Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Changelog"
            echo
            printf '%s\n' "$CHANGELOG_SECTION"
            echo
            echo "[← Version archive](README.md)"
          } > "$PAGE"

          INDEX="docs/versions/README.md"
          if [ ! -f "$INDEX" ]; then
            {
              echo "# KeySwiper APK version archive"
              echo
              echo "Every successful main-branch APK build is preserved as a GitHub Release and gets its own version page."
              echo
              echo "## Builds"
              echo
            } > "$INDEX"
          fi

          ENTRY="- [$VERSION_NAME · build $VERSION_CODE · run $GITHUB_RUN_NUMBER]($(basename "$PAGE")) — [APK]($DOWNLOAD_URL) — SHA-256: $SHA256"
          if ! grep -Fq "run $GITHUB_RUN_NUMBER]" "$INDEX"; then
            awk -v entry="$ENTRY" '
              {print}
              /^## Builds$/ && !done {getline; print ""; print entry; done=1}
            ' "$INDEX" > "$INDEX.tmp"
            mv "$INDEX.tmp" "$INDEX"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PAGE" "$INDEX"
          if ! git diff --cached --quiet; then
            git commit -m "docs: archive KeySwiper $VERSION_NAME build $VERSION_CODE run $GITHUB_RUN_NUMBER [skip ci]"
            git push
          fi

